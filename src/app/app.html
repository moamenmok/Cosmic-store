<header class="sticky top-0 z-50 border-b border-border bg-surface/95 backdrop-blur-xl">
  <app-navbar></app-navbar>
</header>

<main>
  <router-outlet></router-outlet>
  <ngx-spinner
    type="ball-scale-multiple"
    [fullScreen]="true"
    bdColor="transparent"
    color="transparent"
    size="default"
    template="<span></span>"
  >
    <div class="cosmic-loader" role="status" aria-live="polite">
      <!-- نجوم الخلفية -->
      <span class="cl-star" style="--x: 12%; --y: 18%; --d: 0s"></span>
      <span class="cl-star" style="--x: 82%; --y: 12%; --d: 0.6s"></span>
      <span class="cl-star" style="--x: 70%; --y: 78%; --d: 1.1s"></span>
      <span class="cl-star" style="--x: 20%; --y: 72%; --d: 1.6s"></span>
      <span class="cl-star" style="--x: 48%; --y: 8%; --d: 0.3s"></span>
      <span class="cl-star" style="--x: 92%; --y: 52%; --d: 1.9s"></span>
      <span class="cl-star" style="--x: 6%; --y: 48%; --d: 1.3s"></span>

      <div class="cl-orbit">
        <span class="cl-ring cl-ring-1"><i class="cl-planet"></i></span>
        <span class="cl-ring cl-ring-2"><i class="cl-moon"></i></span>
        <span class="cl-glow"></span>
        <div class="cl-core">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
      </div>

      <p class="cl-text">
        {{ 'common.loading' | translate }}
        <span class="cl-dots"><i></i><i></i><i></i></span>
      </p>
    </div>
  </ngx-spinner>
</main>

<app-footer></app-footer>
