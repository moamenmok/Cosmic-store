<article
  class="group overflow-hidden rounded-2xl border border-border bg-surface transition duration-300 hover:-translate-y-1 hover:border-brand/40 hover:shadow-xl hover:shadow-brand/10"
>
  <div class="relative overflow-hidden bg-white">
    <span
      class="absolute left-3 top-3 z-10 rounded-full cosmic-gradient px-3 py-1 text-xs font-bold text-white"
      >{{ product().brand.name }}</span
    >
    <img
      [src]="product().imageCover"
      [alt]="product().title"
      width="400"
      height="400"
      loading="lazy"
      class="h-60 w-full object-contain p-4 transition duration-500 group-hover:scale-105"
    />

    <div
      class="absolute right-3 top-3 flex flex-col gap-2 transition duration-300 lg:translate-x-2 lg:opacity-0 lg:group-focus-within:translate-x-0 lg:group-focus-within:opacity-100 lg:group-hover:translate-x-0 lg:group-hover:opacity-100"
    >
      <button
        type="button"
        (click)="addToWishlist(product()._id)"
        [disabled]="!isLogged || isAddingToWishlist()"
        [attr.aria-label]="'common.addToWishlist' | translate"
        [attr.aria-pressed]="isInWishlist()"
        [class.text-slate-600]="!isInWishlist()"
        [class.text-rose-500]="isInWishlist()"
        class="flex h-9 w-9 items-center justify-center rounded-full bg-white shadow-md transition hover:scale-110 active:scale-90 hover:text-rose-500 focus-visible:ring-2 focus-visible:ring-brand disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (isAddingToWishlist()) {
          <i class="fa-solid fa-circle-notch fa-spin"></i>
        } @else {
          <i
            class="fa-heart"
            [class.fa-regular]="!isInWishlist()"
            [class.fa-solid]="isInWishlist()"
          ></i>
        }
      </button>
      <a
        [routerLink]="['/product-details', product()._id]"
        [attr.aria-label]="'common.viewDetails' | translate"
        class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-slate-600 shadow-md transition hover:scale-110 hover:text-brand focus-visible:ring-2 focus-visible:ring-brand"
      >
        <i class="fa-regular fa-eye"></i>
      </a>
    </div>
  </div>

  <div class="p-4">
    <span
      class="mb-2 inline-block rounded-full bg-brand/10 px-2.5 py-0.5 text-xs font-semibold text-brand-700 dark:text-brand-300"
    >
      {{ product().category.name }}
    </span>

    <h3 class="mb-1.5 min-h-12 font-semibold leading-6">
      <a
        [routerLink]="['/product-details', product()._id]"
        class="line-clamp-2 text-text transition hover:text-brand"
      >
        {{ product().title }}
      </a>
    </h3>

    <div
      class="mb-3 flex items-center gap-2"
      [attr.aria-label]="'details.rating' | translate: { rating: product().ratingsAverage }"
    >
      <div class="flex gap-0.5 text-xs text-amber-400">
        @for (filled of stars(); track $index) {
          <i [class]="filled ? 'fa-solid fa-star' : 'fa-regular fa-star'"></i>
        }
      </div>
      <span class="text-xs text-muted"
        >{{ product().ratingsAverage }} ({{ product().ratingsQuantity }})</span
      >
    </div>

    <div class="flex items-center justify-between">
      <span class="text-lg font-extrabold text-text"
        >{{ product().price }}<span class="text-xs font-semibold text-muted">EGP</span></span
      >
      <button
        type="button"
        (click)="addToCart(product()._id)"
        [disabled]="!isLogged || isAddingToCart()"
        [attr.aria-label]="'common.addToCart' | translate"
        class="cosmic-gradient flex h-10 w-10 items-center justify-center rounded-full text-white shadow-lg shadow-brand/25 transition hover:scale-110 active:scale-95 disabled:opacity-60 focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
      >
        @if (isAddingToCart()) {
          <i class="fa-solid fa-circle-notch fa-spin"></i>
        } @else {
          <i class="fa-solid fa-cart-plus"></i>
        }
      </button>
    </div>
  </div>
</article>
